name: goreleaser

on:
  push:
    tags:
      - 'v*'
  # Manual runs only build snapshot artifacts; they never publish a Release.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install release validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck

      - name: Validate public release inputs
        run: python3 scripts/check-release-inputs.py

      - name: Verify installer
        run: |
          bash -n scripts/dujiao-next-manager.sh
          shellcheck -x -S warning scripts/dujiao-next-manager.sh scripts/tests/dujiao-next-manager_test.sh
          sudo bash scripts/tests/dujiao-next-manager_test.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies and backend
        run: |
          go mod tidy -diff
          go mod verify
          go vet ./...
          go test ./...
          git diff --exit-code -- go.mod go.sum

    - name: Verify frontends
      run: |
        (cd frontend/admin && pnpm install --frozen-lockfile)
        (cd frontend/user && pnpm install --frozen-lockfile)
        (cd frontend/admin && pnpm test)
        (cd frontend/user && pnpm test)
        git diff --exit-code -- frontend/admin/pnpm-lock.yaml frontend/user/pnpm-lock.yaml

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: Build snapshot (manual validation only)
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean

      - name: Create draft Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload snapshot packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-snapshot-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
