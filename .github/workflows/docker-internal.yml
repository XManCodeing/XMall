name: docker-internal

# No Release/tag trigger; no public distribution or rolling tags.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate: local only; private: existing private package; bootstrap: create an empty private marker first'
        type: choice
        default: validate
        options:
          - validate
          - private
          - bootstrap

permissions:
  contents: read

concurrency:
  group: docker-internal
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  validate:
    if: inputs.mode == 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !.env*
            !config.yml
            !config.yml.*
            /config.yml.example
            !node_modules/
            !db/
            !logs/
            !uploads/
            !backups/
            !*.db
            !*.db-wal
            !*.db-shm
            !*.sqlite
            !*.sqlite3
            !*.sql
            !*.sql.gz
            !*.log
            !*.key
            !*.p12
            !*.pfx
      - name: Check inputs and internal gate tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml skopeo
          node --test scripts/tests/docker-internal-gate.test.cjs
          python3 -m unittest discover -s scripts/tests -p 'docker_internal_registry_test.py'
          python3 scripts/check-release-inputs.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both architectures locally
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/xmall-internal.oci.tar
          tags: xmall-smoke:internal
          build-args: |
            APP_VERSION=internal-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false
      - name: Smoke-test exact archive amd64 image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/xmall-internal.oci.tar" docker-daemon:xmall-smoke:internal
          DOCKER_DEFAULT_PLATFORM=linux/amd64 python3 scripts/docker-smoke.py xmall-smoke:internal
      - name: Remove local archive
        if: always()
        run: rm -f "$RUNNER_TEMP/xmall-internal.oci.tar"

  private-push:
    if: >-
      (inputs.mode == 'private' || inputs.mode == 'bootstrap') &&
      github.ref == 'refs/heads/main' && github.repository == 'XManCodeing/XMall'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !.env*
            !config.yml
            !config.yml.*
            /config.yml.example
            !node_modules/
            !db/
            !logs/
            !uploads/
            !backups/
            !*.db
            !*.db-wal
            !*.db-shm
            !*.sqlite
            !*.sqlite3
            !*.sql
            !*.sql.gz
            !*.log
            !*.key
            !*.p12
            !*.pfx
      - name: Check inputs and internal gate tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml skopeo
          node --test scripts/tests/docker-internal-gate.test.cjs
          python3 -m unittest discover -s scripts/tests -p 'docker_internal_registry_test.py'
          python3 scripts/check-release-inputs.py
      - name: Require private package or explicit empty-marker bootstrap
        id: preflight
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/scripts/docker-internal-gate.cjs`);
            const result = await gate({ github, context, mode: process.env.MODE, allowCreate: true });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Bootstrap empty marker for an unobservable target
        if: steps.preflight.outputs.bootstrapMarker == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.preflight.outputs.image }}
        run: |
          # GitHub documents first-published packages as private by default:
          # https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry#pushing-container-images
          # Empty context, no application layers, only a source association label.
          mkdir -p "$RUNNER_TEMP/xmall-marker-context"
          printf '%s\n' 'FROM scratch' \
            'LABEL org.opencontainers.image.source="https://github.com/XManCodeing/XMall"' | \
            docker buildx build --file - --platform linux/amd64 --provenance=false --sbom=false \
              --output "type=oci,dest=$RUNNER_TEMP/xmall-marker.oci.tar" "$RUNNER_TEMP/xmall-marker-context"
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --username "$GH_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "oci-archive:$RUNNER_TEMP/xmall-marker.oci.tar" "docker://$IMAGE:bootstrap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Confirm actual private visibility and repository link
        id: package
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED: ${{ steps.preflight.outputs.packageId }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/scripts/docker-internal-gate.cjs`);
            const result = await gate({ github, context, mode: process.env.MODE, expected: process.env.EXPECTED });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
      - name: Build both architectures locally before application upload
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/xmall-internal.oci.tar
          tags: ${{ steps.package.outputs.image }}:internal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            APP_VERSION=internal-${{ github.sha }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false
      - name: Smoke-test exact archive amd64 image
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/xmall-internal.oci.tar" docker-daemon:xmall-smoke:internal
          DOCKER_DEFAULT_PLATFORM=linux/amd64 python3 scripts/docker-smoke.py xmall-smoke:internal
          python3 scripts/check-release-inputs.py
      - name: Recheck private package immediately before application push
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED: ${{ steps.package.outputs.packageId }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/scripts/docker-internal-gate.cjs`);
            await gate({ github, context, mode: process.env.MODE, expected: process.env.EXPECTED });
      - name: Push exact tested archive and verify private registry roundtrip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.package.outputs.image }}
          IMAGE_TAG: internal-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --username "$GH_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "oci-archive:$RUNNER_TEMP/xmall-internal.oci.tar" "docker://$IMAGE:$IMAGE_TAG"
          python3 scripts/docker-internal-registry.py "$IMAGE" "$IMAGE_TAG" \
            "$RUNNER_TEMP/ghcr-auth.json" "$RUNNER_TEMP/xmall-internal.oci.tar"
      - name: Recheck private visibility after registry tests
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          EXPECTED: ${{ steps.package.outputs.packageId }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/scripts/docker-internal-gate.cjs`);
            await gate({ github, context, mode: process.env.MODE, expected: process.env.EXPECTED });
      - name: Remove local archives and credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/xmall-internal.oci.tar" "$RUNNER_TEMP/xmall-marker.oci.tar" "$RUNNER_TEMP/ghcr-auth.json"
          rm -rf "$RUNNER_TEMP/xmall-marker-context"
