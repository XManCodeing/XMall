name: docker-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published Release tag (v-prefixed SemVer)'
        required: true
        type: string

permissions:
  contents: read

# Serialize all versions, including manual retries. No rolling/latest tags exist.
concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  DOCKER_BUILD_SUMMARY: 'false'

jobs:
  publish:
    if: >-
      vars.DOCKER_RELEASE_ENABLED == 'true' &&
      github.repository == 'XManCodeing/XMall' &&
      (github.event_name == 'release' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # Gate code comes from the default branch, not an older Release tag.
      # An allowlist means no runtime configuration is materialized here.
      - name: Checkout trusted release gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/docker-release-gate.cjs
            /scripts/tests/docker-release-gate.test.cjs
            /.github/workflows/docker-release.yml
      - name: Test release gate
        run: node --test control/scripts/tests/docker-release-gate.test.cjs
      - name: Validate published Release and existing GHCR package
        id: gate
        uses: actions/github-script@v7
        env:
          ENABLED: ${{ vars.DOCKER_RELEASE_ENABLED }}
          PACKAGE: ${{ vars.DOCKER_RELEASE_PACKAGE }}
          VISIBILITY: ${{ vars.DOCKER_RELEASE_VISIBILITY }}
          RELEASE_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/control/scripts/docker-release-gate.cjs`);
            const result = await gate({ github, context, config: {
              enabled: process.env.ENABLED, package: process.env.PACKAGE,
              visibility: process.env.VISIBILITY, tag: process.env.RELEASE_TAG
            }});
            for (const [key, value] of Object.entries(result)) core.setOutput(key, value);
            core.setOutput('validated', JSON.stringify(result));
      - name: Checkout exact Release commit without sensitive paths
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.revision }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Keep the index complete for check-release-inputs.py; never materialize
          # tracked secrets, even when an old tag accidentally contains them.
          sparse-checkout: |
            /*
            !.env*
            !config.yml
            !config.yml.*
            /config.yml.example
            !node_modules/
            !db/
            !logs/
            !uploads/
            !backups/
            !*.db
            !*.db-wal
            !*.db-shm
            !*.sqlite
            !*.sqlite3
            !*.sql
            !*.sql.gz
            !*.log
            !*.key
            !*.p12
            !*.pfx
      - name: Check source identity and public build inputs
        working-directory: source
        env:
          REVISION: ${{ steps.gate.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          sudo apt-get update
          sudo apt-get install -y python3-yaml skopeo
          python3 scripts/check-release-inputs.py
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build both architectures locally before any push
        uses: docker/build-push-action@v6
        with:
          context: ./source
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/xmall-release.oci.tar
          tags: ${{ steps.gate.outputs.image }}:${{ steps.gate.outputs.imageTag }}
          build-args: |
            APP_VERSION=${{ steps.gate.outputs.tag }}
            VCS_REF=${{ steps.gate.outputs.revision }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          # No GHA/registry cache exports or image/build-record artifacts.
          provenance: false
          sbom: false
      - name: Smoke-test the exact amd64 image from the release archive
        working-directory: source
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            "oci-archive:$RUNNER_TEMP/xmall-release.oci.tar" docker-daemon:xmall-smoke:release
          python3 scripts/docker-smoke.py xmall-smoke:release
          python3 scripts/check-release-inputs.py
      - name: Recheck immutable Release and package immediately before push
        uses: actions/github-script@v7
        env:
          ENABLED: ${{ vars.DOCKER_RELEASE_ENABLED }}
          PACKAGE: ${{ vars.DOCKER_RELEASE_PACKAGE }}
          VISIBILITY: ${{ vars.DOCKER_RELEASE_VISIBILITY }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED: ${{ steps.gate.outputs.validated }}
        with:
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/control/scripts/docker-release-gate.cjs`);
            await gate({ github, context, expected: JSON.parse(process.env.EXPECTED), config: {
              enabled: process.env.ENABLED, package: process.env.PACKAGE,
              visibility: process.env.VISIBILITY, tag: process.env.RELEASE_TAG
            }});
      - name: Push only the tested multi-architecture archive and fixed version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.gate.outputs.image }}
          IMAGE_TAG: ${{ steps.gate.outputs.imageTag }}
        run: |
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            --username "$GH_ACTOR" --password-stdin ghcr.io
          skopeo copy --all --preserve-digests --authfile "$RUNNER_TEMP/ghcr-auth.json" \
            "oci-archive:$RUNNER_TEMP/xmall-release.oci.tar" "docker://$IMAGE:$IMAGE_TAG"
      - name: Verify package visibility after push
        uses: actions/github-script@v7
        env:
          ENABLED: ${{ vars.DOCKER_RELEASE_ENABLED }}
          PACKAGE: ${{ vars.DOCKER_RELEASE_PACKAGE }}
          VISIBILITY: ${{ vars.DOCKER_RELEASE_VISIBILITY }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED: ${{ steps.gate.outputs.validated }}
        with:
          script: |
            const { gate } = require(`${process.env.GITHUB_WORKSPACE}/control/scripts/docker-release-gate.cjs`);
            await gate({ github, context, published: true, expected: JSON.parse(process.env.EXPECTED), config: {
              enabled: process.env.ENABLED, package: process.env.PACKAGE,
              visibility: process.env.VISIBILITY, tag: process.env.RELEASE_TAG
            }});
      - name: Remove local archive and registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/xmall-release.oci.tar" "$RUNNER_TEMP/ghcr-auth.json"
