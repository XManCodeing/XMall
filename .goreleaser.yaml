version: 2

project_name: xmall

# 前端在这里构建并拷进 internal/web/dist/，随后由 -tags=fullstack 的 go:embed 打进二进制。
# 放在 before hooks 而不是 CI step 里，是为了让本地 `goreleaser build --snapshot`
# 与 GitHub Actions 走完全相同的路径。执行前需要有 pnpm（见 .github/workflows/release.yml）。
#
# 注意：hooks 必须是纯字符串。带 cmd/dir/env 的结构化 hook 是 GoReleaser Pro 特性，
# OSS 版会在解析阶段就报 "cannot unmarshal !!map into string" 而整个发布中止。
# 因此换目录一律用 `sh -c 'cd X && ...'`，而不是 dir 字段。
# 另外 hooks 不经过 shell，`cd X && y` 这种写法必须显式包一层 sh -c 才会生效。
before:
  hooks:
    - go mod tidy -diff
    - go mod verify
    - sh -c 'cd frontend/admin && pnpm install --frozen-lockfile'
    - sh -c 'cd frontend/user  && pnpm install --frozen-lockfile'
    # admin 用 fullstack 模式构建：base 为 './' 且注入 __DJ_ADMIN_BASE__ 占位符，
    # 后端启动时按 web.admin_path 替换，使产物可挂载到任意自定义前缀。
    - sh -c 'cd frontend/admin && pnpm run build:fullstack'
    - sh -c 'cd frontend/user  && pnpm run build'
    - sh -c 'rm -rf internal/web/dist && mkdir -p internal/web/dist'
    - sh -c 'cp -r frontend/admin/dist internal/web/dist/admin'
    - sh -c 'cp -r frontend/user/dist  internal/web/dist/user'

builds:
  # 单一产物：内嵌 admin + user SPA，一个二进制跑完整服务。
  - id: xmall
    env:
      - CGO_ENABLED=0
    main: ./cmd/server
    binary: xmall
    # BuildType=release 是后台一键升级的开关：只有 CI 正式产物才允许自我替换，
    # 本地 go build 的二进制版本号是占位值，放开会把开发者自己编译的产物覆盖掉。
    ldflags:
      - -s -w -X github.com/XManCodeing/XMall/internal/version.Version={{.Tag}} -X github.com/XManCodeing/XMall/internal/version.BuildType=release
    flags:
      - "-tags=release,fullstack"
      - "-mod=readonly"
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: xmall
    ids:
      - xmall
    formats: [tar.gz]
    files:
      - ./config.yml.example
      - ./README.md
      - ./doc/发行与升级.md
      - ./LICENSE
      - ./scripts/xmall-manager.sh
    name_template: >-
      {{ .ProjectName }}_
      {{- .Tag }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  groups:
    - title: 🚀 Features
      regexp: '^feat[(:]'
      order: 0
    - title: 🐛 Bug Fixes
      regexp: '^fix[(:]'
      order: 1
    - title: ⚡ Performance
      regexp: '^perf[(:]'
      order: 2
    - title: 🔨 Refactor
      regexp: '^refactor[(:]'
      order: 3
    - title: 📝 Documentation
      regexp: '^docs[(:]'
      order: 4
    - title: 其他
      order: 999
  filters:
    exclude:
      - '^test[(:]'
      - '^chore[(:]'
      - '^ci[(:]'
      - '^build[(:]'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: true
  prerelease: auto
  footer: |
    ---

    非官方二次开发版，依照 GNU GPL v3 发布。第三方组件保留各自许可证。
    构建提交：{{ .FullCommit }}

    - [对应源码](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/archive/{{ .FullCommit }}.tar.gz)
    - [本版部署说明](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/blob/{{ .FullCommit }}/README.md)
    - [许可证](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/blob/{{ .FullCommit }}/LICENSE)

    安装脚本需显式设置 XMALL_UPDATE_REPOSITORY={{ .Env.GITHUB_REPOSITORY }}，不会默认选择上游仓库。
    发布前请核验安装包、对应源码与第三方许可材料。